# Lokalna baza za razvoj. Backend i frontend se pokreću s `make dev`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listica
      POSTGRES_PASSWORD: listica123
      POSTGRES_DB: listica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
